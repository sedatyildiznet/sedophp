name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    name: SQLite / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite,fileinfo
          coverage: none
      - name: Composer validate
        run: composer validate --strict
      - name: Lint
        run: php tools/lint.php
      - name: Test
        run: php tests/run.php
      - name: CLI and HTTP smoke
        if: matrix.php == '8.3'
        run: |
          printf '%s\n'             'APP_ENV=production'             'APP_DEBUG=false'             'APP_URL=http://127.0.0.1:8080'             'DB_DRIVER=sqlite'             "DB_SQLITE=${{ github.workspace }}/storage/test.sqlite"             > .env
          touch storage/test.sqlite
          php sedo migrate
          php sedo doctor
          php sedo route:list
          php sedo serve 127.0.0.1:8080 > /tmp/sedophp-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          test "$(curl -s -o /tmp/home -w '%{http_code}' http://127.0.0.1:8080/)" = "200"
          test "$(curl -s -o /tmp/health -w '%{http_code}' http://127.0.0.1:8080/health)" = "200"
          test "$(curl -s -o /tmp/method -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8080/health)" = "405"
          test "$(curl -s -o /tmp/json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{bad' http://127.0.0.1:8080/health)" = "400"
          kill $SERVER_PID

  mariadb:
    name: MariaDB 11 / PHP 8.3
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sedophp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DB_DRIVER: mysql
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 3306
      TEST_DB_NAME: sedophp
      TEST_DB_USER: root
      TEST_DB_PASS: root
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql,fileinfo
          coverage: none
      - name: Lint
        run: php tools/lint.php
      - name: Test including migrations
        run: php tests/run.php
      - name: Doctor against MariaDB
        run: |
          printf '%s\n'             'APP_ENV=production'             'APP_DEBUG=false'             'DB_DRIVER=mysql'             'DB_HOST=127.0.0.1'             'DB_PORT=3306'             'DB_NAME=sedophp'             'DB_USER=root'             'DB_PASS=root'             > .env
          php sedo doctor
