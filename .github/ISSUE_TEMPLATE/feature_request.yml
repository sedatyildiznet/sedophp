name: Feature request
description: Propose a small feature that fits SedoPHP's design rules
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete PHP development problem should this solve?
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Proposed API
      description: Show the simplest application code you would like to write.
      render: php
    validations:
      required: true
  - type: checkboxes
    id: philosophy
    attributes:
      label: SedoPHP fit
      options:
        - label: This remains understandable to a PHP developer without framework-specific knowledge.
          required: true
        - label: This does not require a long-running service for ordinary use.
          required: true
