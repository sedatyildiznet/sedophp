name: Bug report
description: Report reproducible incorrect behavior in SedoPHP
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve SedoPHP. Please keep the report reproducible.
  - type: input
    id: version
    attributes:
      label: SedoPHP version
      placeholder: 0.1.0-dev / commit SHA
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: 8.3.x
    validations:
      required: true
  - type: dropdown
    id: server
    attributes:
      label: Environment
      options:
        - cPanel / Apache
        - cPanel / LiteSpeed
        - Plesk
        - Nginx
        - PHP built-in server
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest PHP example that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
